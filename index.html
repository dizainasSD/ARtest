<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- Pridedame gesture-handler biblioteką, kad veiktų judinimas -->
    <script src="https://raw.githack.com/fcor/aframe-gesture-handler/master/dist/aframe-gesture-handler.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <!-- Pridedame 'cursor', kad veiktų paspaudimų aptikimas -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" cursor="rayOrigin: mouse">
      
      <a-marker preset="hiro">
        
        <!-- NAUJAS KONTEINERIS JUDINIMUI -->
        <!-- Šis 'a-entity' "pagaus" vilkimo judesį ir judės kartu su visu modeliu -->
        <a-entity position="0 0 0" gesture-handler>

          <!-- ČIA YRA VISA JŪSŲ SENOJI KODO STRUKTŪRA, KURI DABAR YRA VIDUJE -->
          <a-entity
              position="0 0 0"
              rotation="-90 0 0"
              scale="0.01 0.01 0.01">
            <a-entity
                  position="0 0 -0.5" <!-- Modelis nuleidžiamas TIK ČIA -->
                  rotation="0 90 0">
                <a-gltf-model
                    src="nr8.glb?v=1.0" <!-- Pridėtas cache busteris -->
                    scale="0.1 0.1 0.1"
                    position="0 0 0"
                    class="clickable"> <!-- Pridedame 'clickable' klasę -->
                </a-gltf-model>
            </a-entity>
          </a-entity>

        </a-entity> <!-- Judinamo konteinerio pabaiga -->

      </a-marker>

      <!-- PRIDEDAME ŠVIESOS ŠALTINIUS -->
      <!-- Aplinkos šviesa, kad modelis nebūtų visiškai juodas šešėliuose -->
      <a-entity light="type: ambient; color: #BBB"></a-entity>
      <!-- Kryptinė šviesa (kaip saulė), kad duotų formą ir atspindžius -->
      <a-entity light="type: directional; color: #FFF; intensity: 0.7" position="-1 1 2"></a-entity>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
