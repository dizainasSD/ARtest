<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/fcor/aframe-gesture-handler/master/dist/aframe-gesture-handler.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
      
      <a-marker preset="hiro">
        <a-entity position="0 0 0.1" gesture-handler>
          <a-entity
              position="0 0 0"
              rotation="-90 0 0"
              scale="0.001 0.001 0.001">
            <a-entity
                  position="0 -0.5 -0.1"
                  rotation="0 90 0">
                <a-gltf-model
                    src="nr9.glb"
                    scale="1 1 1"
                    position="0 0 0"
                    class="clickable">
                </a-gltf-model>
            </a-entity>
          </a-entity>

        </a-entity>

      </a-marker>

      <a-entity light="type: ambient; color: #BBB"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 0.7" position="-1 1 2"></a-entity>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
